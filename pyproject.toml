[project]
name = "northstar-causal-demand-analytics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "faker>=40.36.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pulp>=3.3.2",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Validates the generated PBIP/PBIR documents against Microsoft's published
    # schemas (mirrored in tests/fixtures/fabric_schemas/). Needs >=4.18 for the
    # `referencing` registry that resolves the schemas' relative $refs offline.
    "jsonschema>=4.18",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle errors, pyflakes, warnings.
#
# Deliberately no "I" (isort). Every entry point calls sys.path.insert() to put
# `src/` on the path *before* importing from it — that is why `# noqa: E402`
# appears throughout. An import sorter would hoist those imports above the
# sys.path line and break them.
select = ["E", "F", "W"]
